<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CAT Informatika</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 420px;

            margin: 100px auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 15px;

            text-align: center;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>CAT Informatika</h1>

        <div class="subtitle">
            Login Sistem Ujian
        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form action="/login" method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
