<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ujian CAT Informatika</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }


        .header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .header h2 {
            margin: 0;
        }


        .timer {
            font-size: 20px;
            font-weight: bold;
        }


        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }


        .card {
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }


        .progress {
            color: #555;
            margin-bottom: 25px;
        }


        .theta {
            background: #f1f5f9;

            padding: 10px 15px;

            border-radius: 8px;

            margin-bottom: 25px;

            font-size: 14px;
        }


        .question {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 25px;
        }


        .option {
            display: block;

            padding: 15px;

            margin: 12px 0;

            border: 1px solid #ddd;

            border-radius: 8px;

            cursor: pointer;
        }


        .option:hover {
            background: #f1f5f9;
        }


        .option input {
            margin-right: 10px;
        }


        .button {
            margin-top: 25px;

            padding: 12px 30px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        .button:hover {
            background: #1d4ed8;
        }

    </style>

</head>


<body>


    <div class="header">

        <h2>
            CAT Informatika
        </h2>


        <div class="timer">
            Waktu: 60:00
        </div>

    </div>



    <div class="container">

        <div class="card">


            <div class="progress">

                Soal {{ nomor }}
                dari {{ total }}

            </div>


            <div class="theta">

                Estimasi kemampuan:
                <strong>
                    {{ "%.3f"|format(theta) }}
                </strong>

            </div>


            <div class="question">

                {{ item["question"] }}

            </div>


            <form
                action="/answer"
                method="POST"
            >


                <label class="option">

                    <input
                        type="radio"
                        name="answer"
                        value="A"
                        required
                    >

                    A. {{ item["option_a"] }}

                </label>



                <label class="option">

                    <input
                        type="radio"
                        name="answer"
                        value="B"
                        required
                    >

                    B. {{ item["option_b"] }}

                </label>



                <label class="option">

                    <input
                        type="radio"
                        name="answer"
                        value="C"
                        required
                    >

                    C. {{ item["option_c"] }}

                </label>



                <label class="option">

                    <input
                        type="radio"
                        name="answer"
                        value="D"
                        required
                    >

                    D. {{ item["option_d"] }}

                </label>



                <button
                    type="submit"
                    class="button"
                >

                    Jawab & Lanjut

                </button>


            </form>

        </div>

    </div>


</body>

</html>
