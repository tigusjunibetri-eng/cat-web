<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hasil CAT</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }


        .container {
            width: 90%;
            max-width: 700px;

            margin: 80px auto;

            background: white;

            padding: 40px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);
        }


        h1 {
            margin-bottom: 30px;
        }


        .result {
            font-size: 20px;

            margin: 15px;
        }


        .theta {
            font-size: 40px;

            font-weight: bold;

            margin: 30px;
        }


        .button {
            display: inline-block;

            margin-top: 20px;

            padding: 12px 30px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;
        }

    </style>

</head>


<body>


    <div class="container">

        <h1>
            CAT Selesai
        </h1>


        <div class="result">

            Jumlah soal:

            <strong>
                {{ result["answered"] }}
            </strong>

        </div>


        <div class="theta">

            {{ "%.3f"|format(result["theta"]) }}

        </div>


        <div class="result">

            Estimasi Kemampuan (Theta)

        </div>


        <a
            href="/"
            class="button"
        >

            Kembali

        </a>

    </div>


</body>

</html>
